<meta name="theme-color" id="themeColor" content="#E52D27">

<style>
/* Layout: 2015-era tablet video app. Coloured top bar with icon tabs, grey ground with white cards,
   watch screen = pinned player on top, one scrolling column below (info, channel, Up next, comments last). */
:root{
  --bar:#E52D27; --bar-ink:#ffffff; --bar-ink-dim:rgba(255,255,255,.62);
  --accent:#E52D27; --accent-ink:#ffffff;
  --bg:#EEEEEE; --card:#ffffff; --ink:#222222; --ink-2:#767676; --line:#e0e0e0;
  --chip:#f1f1f1; --shadow:0 1px 2px rgba(0,0,0,.14);
  --font:'Roboto', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bar:#B3221E; --bar-ink:#ffffff; --bar-ink-dim:rgba(255,255,255,.6);
  --accent:#F0453F; --accent-ink:#ffffff;
  --bg:#141414; --card:#1f1f1f; --ink:#ececec; --ink-2:#a0a0a0; --line:#2e2e2e;
  --chip:#2a2a2a; --shadow:0 1px 2px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bar:#B3221E; --bar-ink:#ffffff; --bar-ink-dim:rgba(255,255,255,.6);
  --accent:#F0453F; --accent-ink:#ffffff;
  --bg:#141414; --card:#1f1f1f; --ink:#ececec; --ink-2:#a0a0a0; --line:#2e2e2e;
  --chip:#2a2a2a; --shadow:0 1px 2px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--font);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%;display:block}
[hidden]{display:none!important}
svg{width:24px;height:24px;fill:currentColor;flex:none}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bar);color:var(--bar-ink);box-shadow:0 2px 4px rgba(0,0,0,.18);
  padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.top-row{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:500;font-size:20px;letter-spacing:.2px}
.brand svg{width:28px;height:28px}
.top-row .spacer{flex:1}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.search{display:flex;align-items:center;gap:8px;flex:1;max-width:640px}
.search input{flex:1;min-width:0;height:36px;border:0;border-radius:2px;padding:0 12px;font:inherit;font-size:16px;background:var(--card);color:var(--ink)}
.tabs{display:flex}
.tab{flex:1;height:48px;display:grid;place-items:center;color:var(--bar-ink-dim);position:relative}
.tab[aria-selected="true"]{color:var(--bar-ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--bar-ink)}

/* ---------- pages ---------- */
main{padding-block:12px 96px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.section-title{font-size:15px;font-weight:500;margin:16px 4px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--card);box-shadow:var(--shadow);border-radius:2px}
.vcard{display:flex;flex-direction:column;text-align:left;width:100%;overflow:hidden}
.thumb{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.82);color:#fff;font-size:12px;font-weight:500;padding:1px 4px;border-radius:2px;font-variant-numeric:tabular-nums}
.vmeta{display:flex;gap:12px;padding:12px}
.vtext{min-width:0;flex:1}
.vtitle{font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vsub{color:var(--ink-2);font-size:13px;margin-top:4px}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:500;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.note{padding:16px;color:var(--ink-2);line-height:1.5}
.note b{color:var(--ink)}
.rows{display:flex;flex-direction:column;gap:1px;background:var(--line)}
.row{display:flex;gap:12px;padding:10px 12px;background:var(--card);text-align:left;width:100%;align-items:flex-start}
.row .thumb{width:168px;flex:none}
.row .vtitle{font-size:14px}

.bubbles{display:flex;gap:16px;overflow-x:auto;padding:12px;scrollbar-width:none}
.bubble{display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;flex:none;font-size:12px;color:var(--ink-2);text-align:center}
.bubble .avatar{width:56px;height:56px;font-size:20px}
.bubble span{width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.field{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 16px}
.field input{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:2px;padding:0 10px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink)}
.btn{height:40px;padding:0 16px;border-radius:2px;background:var(--accent);color:var(--accent-ink);font-weight:500;text-transform:uppercase;letter-spacing:.5px;font-size:13px}
.btn.quiet{background:var(--chip);color:var(--ink)}

/* ---------- watch screen ---------- */
.watch{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#000;
  padding-top:env(safe-area-inset-top,0px);transition:transform .22s ease}
.watch.mini{inset:auto;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  width:min(320px,58vw);padding:0;box-shadow:0 6px 18px rgba(0,0,0,.4);background:#000}
.watch.mini .watch-scroll{display:none}
.player{position:relative;width:100%;aspect-ratio:16/9;max-height:60vh;background:#000;flex:none}
.watch.mini .player{max-height:none}
.player .yt, .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.overlay{position:absolute;inset:0;z-index:2;touch-action:none;user-select:none;-webkit-user-select:none}
.overlay.passthrough{pointer-events:none}
.ctrls{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;opacity:0;transition:opacity .2s;pointer-events:none}
.ctrls.show{opacity:1;pointer-events:auto}
.watch.mini .ctrls{display:none}
.ctrl-top{position:absolute;top:4px;left:4px;right:4px;display:flex;align-items:center}
.ctrl-top .spacer{flex:1}
.ctrl-mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:48px;pointer-events:none}
.ctrl-mid button{pointer-events:auto}
.ctrl-mid .big svg{width:56px;height:56px}
.ctrl-mid .side svg{width:36px;height:36px}
.ctrl-bot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:0 6px 4px 14px;font-size:12px;font-variant-numeric:tabular-nums}
.ctrl-bot input[type=range]{flex:1;min-width:0;height:24px;-webkit-appearance:none;appearance:none;background:transparent}
.ctrl-bot input[type=range]::-webkit-slider-runnable-track{height:3px;background:linear-gradient(to right,var(--accent) var(--p,0%),rgba(255,255,255,.35) var(--p,0%))}
.ctrl-bot input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);margin-top:-5.5px}
.ctrl-bot input[type=range]::-moz-range-track{height:3px;background:rgba(255,255,255,.35)}
.ctrl-bot input[type=range]::-moz-range-progress{height:3px;background:var(--accent)}
.ctrl-bot input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--accent)}
.seek-flash{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.55);color:#fff;border-radius:24px;padding:8px 14px;font-size:13px;font-weight:500;opacity:0;transition:opacity .25s;pointer-events:none;z-index:3}
.seek-flash.l{left:10%} .seek-flash.r{right:10%} .seek-flash.show{opacity:1}
.mini-x{position:absolute;top:2px;right:2px;z-index:4;color:#fff;background:rgba(0,0,0,.55);width:30px;height:30px;border-radius:50%;display:none;place-items:center}
.mini-x svg{width:18px;height:18px}
.watch.mini .mini-x{display:grid}
.yt-error{position:absolute;inset:0;z-index:1;display:grid;place-items:center;text-align:center;color:#fff;padding:16px;background:#111}
.yt-error a{color:#fff}

.watch-scroll{flex:1;overflow-y:auto;background:var(--bg);-webkit-overflow-scrolling:touch;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.block{background:var(--card);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.info{padding-block:14px 4px}
.title-row{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left}
.title-row h1{font-size:18px;font-weight:400;line-height:1.3;margin:0;flex:1;min-width:0;text-wrap:balance}
.title-row svg{color:var(--ink-2);transition:transform .2s;margin-top:1px}
.title-row[aria-expanded="true"] svg{transform:rotate(180deg)}
.views{color:var(--ink-2);margin-top:4px;font-variant-numeric:tabular-nums}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);font-size:13px;line-height:1.5;padding:8px 0 4px}
.desc .pub{color:var(--ink-2);display:block;margin-bottom:6px}
.actions{display:flex;justify-content:space-around;padding:6px 0 4px}
.act{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;padding:6px;color:var(--ink-2);font-size:12px;font-variant-numeric:tabular-nums}
.act[aria-pressed="true"]{color:var(--accent)}
.chan{display:flex;align-items:center;gap:12px;padding-block:12px}
.chan .avatar{width:40px;height:40px}
.chan-name{font-weight:500}
.chan-subs{color:var(--ink-2);font-size:12px}
.chan .grow{flex:1;min-width:0}
.sub{display:flex;align-items:stretch;border-radius:2px;overflow:hidden;font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.sub .s1{background:var(--accent);color:var(--accent-ink);padding:8px 12px;display:flex;align-items:center;gap:4px}
.sub .s1 svg{width:18px;height:18px}
.sub .s2{background:var(--chip);color:var(--ink-2);padding:8px 10px;font-variant-numeric:tabular-nums}
.sub[aria-pressed="true"] .s1{background:var(--chip);color:var(--ink-2)}
.upnext-head{display:flex;align-items:center;justify-content:space-between;padding-block:12px 4px}
.upnext-head h2,.comments-head h2{font-size:14px;font-weight:500;margin:0}
.switch{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.track{width:34px;height:14px;border-radius:7px;background:var(--line);position:relative;transition:background .2s}
.track::after{content:"";position:absolute;top:-3px;left:-2px;width:20px;height:20px;border-radius:50%;background:#fafafa;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s,background .2s}
.switch[aria-checked="true"] .track{background:color-mix(in srgb,var(--accent) 50%,transparent)}
.switch[aria-checked="true"] .track::after{transform:translateX(18px);background:var(--accent)}
.watch .rows{background:transparent;gap:0}
.watch .row{padding:8px 0;background:transparent}
.watch .row .thumb{width:min(168px,40%)}
.upnext-first{border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:4px}
.comments-head{padding-block:16px 8px}
.comment{display:flex;gap:12px;padding:10px 0}
.comment .avatar{width:32px;height:32px;font-size:13px}
.comment .who{font-size:12px;color:var(--ink-2)}
.comment .who b{color:var(--ink);font-weight:500}
.comment p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.comment .likes{font-size:12px;color:var(--ink-2);margin-top:4px;display:flex;align-items:center;gap:4px}
.comment .likes svg{width:14px;height:14px}
.muted{color:var(--ink-2);padding:12px 0}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#323232;color:#fff;padding:12px 20px;border-radius:2px;font-size:14px;opacity:0;transition:.2s;z-index:100;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ⋮ menu on the player (2015 app kept extras behind a three-dot menu) */
.menu{position:absolute;top:44px;right:8px;z-index:5;background:var(--card);color:var(--ink);border-radius:2px;box-shadow:0 4px 14px rgba(0,0,0,.4);padding:6px 0;min-width:240px;max-width:calc(100% - 16px)}
.menu button,.menu a{display:flex;align-items:center;gap:14px;width:100%;padding:11px 16px;text-align:left;font-size:14px;color:var(--ink);text-decoration:none}
.menu svg{width:20px;height:20px;color:var(--ink-2)}

/* closer-to-2015 watch details: smaller title, compact counts, slimmer channel row, smaller Up next */
.title-row h1{font-size:16px;line-height:1.35}
.views{font-size:13px}
.actions{justify-content:flex-start;gap:4px;padding:8px 0 10px;margin-left:-8px}
.act{flex-direction:row;gap:6px;min-width:0;padding:6px 10px;font-size:13px}
.act svg{width:20px;height:20px}
.act .lbl{display:none}
.chan{padding-block:10px}
.chan .avatar{width:36px;height:36px}
.chan-name{font-size:14px}
.sub{font-size:12px}
.sub .s1{padding:6px 10px}
.sub .s2{padding:6px 8px}
.watch .row{padding:6px 0;gap:10px}
.watch .row .thumb{width:min(150px,38%)}
.watch .row .vtitle{font-size:13.5px}
.watch .row .vsub{font-size:12px;margin-top:2px}

@media (max-width:520px){ .row .thumb{width:40%} .ctrl-mid{gap:28px} }

/* Turn the phone or iPad sideways while watching: the video fills the whole screen. */
@media (orientation:landscape) and (pointer:coarse){
  .watch:not(.mini){padding:0;background:#000}
  .watch:not(.mini) .player{position:fixed;inset:0;width:100%;height:100%;max-height:none;aspect-ratio:auto}
  .watch:not(.mini) .watch-scroll{display:none}
  .watch:not(.mini) .ctrl-top{top:calc(4px + env(safe-area-inset-top,0px));left:calc(4px + env(safe-area-inset-left,0px));right:calc(4px + env(safe-area-inset-right,0px))}
  .watch:not(.mini) .ctrl-bot{padding-left:calc(14px + env(safe-area-inset-left,0px));padding-right:calc(6px + env(safe-area-inset-right,0px));padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}
  .watch:not(.mini) .menu{top:calc(44px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>

<script>
/* ---------------- storage ---------------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('rerun_'+k); return v===null ? d : JSON.parse(v) }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem('rerun_'+k, JSON.stringify(v)) }catch(e){} }
};
const S = {
  key: LS.get('key',''), subs: LS.get('subs',[]), history: LS.get('history',[]),
  later: LS.get('later',[]), liked: LS.get('liked',[]), autoplay: LS.get('autoplay',true),
  tab: 'home', current: null, upnext: [], back: []
};

/* Demo picks (all from 2015) used until an API key is added. */
const DEMO = [
  {id:'YQHsXMglC9A', title:'Adele - Hello', channelTitle:'AdeleVEVO'},
  {id:'fRh_vgS2dFE', title:'Justin Bieber - Sorry (PURPOSE : The Movement)', channelTitle:'JustinBieberVEVO'},
  {id:'YqeW9_5kURI', title:'Major Lazer & DJ Snake - Lean On (feat. MØ)', channelTitle:'Major Lazer Official'},
  {id:'uxpDa-c-4Mc', title:'Drake - Hotline Bling', channelTitle:'DrakeVEVO'},
  {id:'OPf0YbXqDm0', title:'Mark Ronson - Uptown Funk ft. Bruno Mars', channelTitle:'MarkRonsonVEVO'},
  {id:'RgKAFK5djSk', title:'Wiz Khalifa - See You Again ft. Charlie Puth', channelTitle:'Wiz Khalifa'},
  {id:'jNQXAC9IVRw', title:'Me at the zoo', channelTitle:'jawed'},
  {id:'9bZkp7q19f0', title:'PSY - GANGNAM STYLE M/V', channelTitle:'officialpsy'}
];

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const thumb = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const num = n => n==null ? '' : Number(n).toLocaleString('en-AU');
function short(n){ if(n==null) return ''; n=+n; if(n>=1e9) return (n/1e9).toFixed(1).replace(/\.0$/,'')+'B'; if(n>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M'; if(n>=1e3) return (n/1e3).toFixed(n>=1e4?0:1).replace(/\.0$/,'')+'K'; return String(n) }
function ago(iso){ if(!iso) return ''; const s=(Date.now()-new Date(iso))/1000; const u=[['year',31536000],['month',2592000],['week',604800],['day',86400],['hour',3600],['minute',60]]; for(const [n,v] of u){ const k=Math.floor(s/v); if(k>=1) return `${k} ${n}${k>1?'s':''} ago` } return 'just now' }
function isoDur(d){ if(!d) return ''; const m=d.match(/P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/); if(!m) return ''; const h=(+m[1]||0)*24+(+m[2]||0), mi=+m[3]||0, s=+m[4]||0; return h ? `${h}:${String(mi).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${mi}:${String(s).padStart(2,'0')}` }
function clock(t){ t=Math.max(0,Math.floor(t||0)); const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60; return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}` }
function initial(name){ return esc((name||'?').trim().charAt(0).toUpperCase()) }
function avatarHTML(name, img){ return `<div class="avatar">${img?`<img src="${esc(img)}" alt="">`:initial(name)}</div>` }
let toastT; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200) }
function parseId(s){ s=(s||'').trim(); const m=s.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/); if(m) return m[1]; if(/^[\w-]{11}$/.test(s) && /[\d_-]/.test(s)) return s; return null }

/* ---------------- YouTube Data API ---------------- */
async function yt(path, params){
  const u = new URL('https://www.googleapis.com/youtube/v3/'+path);
  Object.entries({...params, key:S.key}).forEach(([k,v])=>u.searchParams.set(k,v));
  const r = await fetch(u); const j = await r.json();
  if(j.error) throw new Error(j.error.message || 'Request failed');
  return j;
}
function fromVideo(it){
  const sn=it.snippet||{}, st=it.statistics||{}, cd=it.contentDetails||{};
  return { id:it.id, title:sn.title, channelId:sn.channelId, channelTitle:sn.channelTitle, published:sn.publishedAt,
    description:sn.description, views:st.viewCount, likes:st.likeCount, comments:st.commentCount, duration:isoDur(cd.duration) };
}
async function videosById(ids){
  ids = ids.filter(Boolean); if(!ids.length) return [];
  const j = await yt('videos',{part:'snippet,statistics,contentDetails', id:ids.slice(0,50).join(','), maxResults:50});
  const map = new Map(j.items.map(i=>[i.id, fromVideo(i)]));
  return ids.map(id=>map.get(id)).filter(Boolean);
}

const cache = new Map(); // id -> video object, so tapping a card has data immediately

async function channelUploads(channelId, n){
  const c = await yt('channels',{part:'contentDetails', id:channelId});
  const pl = c.items?.[0]?.contentDetails?.relatedPlaylists?.uploads; if(!pl) return [];
  const p = await yt('playlistItems',{part:'contentDetails', playlistId:pl, maxResults:n});
  return videosById(p.items.map(i=>i.contentDetails.videoId));
}
async function subsUploads(per){
  const all = (await Promise.all(S.subs.slice(0,12).map(s=>channelUploads(s.id, per).catch(()=>[])))).flat();
  return remember(all.sort((a,b)=>new Date(b.published)-new Date(a.published)).slice(0,24));
}

/* ---------------- player ---------------- */
let player=null, apiReady=false, playerReady=false, pendingId=null, playing=false;
window.onYouTubeIframeAPIReady = () => { apiReady = true; if(pendingId) loadPlayer(pendingId) };
function loadPlayer(id){
  $('#ytError').hidden = true;
  $('#btnOpen').href = 'https://www.youtube.com/watch?v='+id;
  if(!apiReady){ pendingId = id; return }
  if(!player){
    pendingId = id;
    player = new YT.Player('yt', { videoId:id, width:'100%', height:'100%',
      playerVars:{ autoplay:1, controls:0, playsinline:1, rel:0, iv_load_policy:3, fs:0, disablekb:1, modestbranding:1 },
      events:{
        onReady: () => { playerReady = true; if(pendingId && pendingId!==id) player.loadVideoById(pendingId); pendingId=null; showCtrls() },
        onStateChange: e => { playing = e.data===1; setPlayIcon(); if(e.data===0) ended(); if(playing) hideCtrlsSoon() },
        onError: e => showYtError(e.data)
      }});
    return;
  }
  if(playerReady) player.loadVideoById(id); else pendingId = id;
}
function showYtError(code){
  const id = S.current?.id;
  const why = (code===101||code===150||code===153) ? 'The uploader doesn’t allow this video to play outside YouTube.' : code===100 ? 'This video is unavailable.' : 'This video can’t be played here.';
  const box = $('#ytError'); box.hidden = false;
  box.innerHTML = `<div>${why}<br><br><a href="https://www.youtube.com/watch?v=${esc(id)}" target="_blank" rel="noopener">Watch it on YouTube</a></div>`;
}
function setPlayIcon(){ $('#playIcon').setAttribute('href', playing?'#i-pause':'#i-play'); $('#btnPlay').setAttribute('aria-label', playing?'Pause':'Play') }
function ended(){ if(S.autoplay && S.upnext[0]) openVideo(S.upnext[0].id, {fromAutoplay:true}) }

const ctrls = $('#ctrls'); let hideT;
function showCtrls(){ ctrls.classList.add('show'); hideCtrlsSoon() }
function hideCtrlsSoon(){ clearTimeout(hideT); hideT = setTimeout(()=>{ if(playing && document.getElementById('moreMenu').hidden) ctrls.classList.remove('show') }, 3000) }
function toggleCtrls(){ if(ctrls.classList.contains('show')){ ctrls.classList.remove('show'); closeMenu() } else showCtrls() }

setInterval(()=>{
  if(!playerReady || !player.getDuration) return;
  const d = player.getDuration()||0, c = player.getCurrentTime()||0;
  $('#tDur').textContent = clock(d);
  if(!seeking){ $('#tCur').textContent = clock(c); const p = d? c/d*1000 : 0; seekEl.value = p; seekEl.style.setProperty('--p', p/10+'%') }
}, 250);
const seekEl = $('#seek'); let seeking=false;
seekEl.addEventListener('input', ()=>{ seeking=true; showCtrls(); const d=player?.getDuration?.()||0; $('#tCur').textContent = clock(seekEl.value/1000*d); seekEl.style.setProperty('--p', seekEl.value/10+'%') });
seekEl.addEventListener('change', ()=>{ const d=player?.getDuration?.()||0; player?.seekTo?.(seekEl.value/1000*d, true); seeking=false });

$('#btnPlay').onclick = () => { if(!playerReady) return; playing ? player.pauseVideo() : player.playVideo(); showCtrls() };
$('#btnNext').onclick = () => { if(S.upnext[0]) openVideo(S.upnext[0].id) };
$('#btnPrev').onclick = () => {
  if(playerReady && player.getCurrentTime() > 5){ player.seekTo(0,true); return }
  const prev = S.back.pop(); if(prev) openVideo(prev, {noPush:true}); else player?.seekTo?.(0,true);
};
$('#btnMin').onclick = () => minimise();
$('#miniClose').onclick = e => { e.stopPropagation(); closeWatch() };
const moreMenu = $('#moreMenu');
function closeMenu(){ moreMenu.hidden = true; $('#btnMore').setAttribute('aria-expanded','false') }
$('#btnMore').onclick = e => { e.stopPropagation(); const open = moreMenu.hidden; moreMenu.hidden = !open; $('#btnMore').setAttribute('aria-expanded', String(open)); showCtrls(); clearTimeout(hideT) };
$('#btnOpen').addEventListener('click', closeMenu);
$('#btnTouch').onclick = () => { closeMenu(); const o=$('#overlay'); o.classList.add('passthrough'); ctrls.classList.remove('show'); toast('Taps go to the video for 8 seconds'); setTimeout(()=>o.classList.remove('passthrough'), 8000) };
$('#btnFull').onclick = () => {
  const el = $('#player');
  const fs = document.fullscreenElement || document.webkitFullscreenElement;
  if(fs){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); return }
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if(req) Promise.resolve(req.call(el)).catch(()=>toast('Full screen isn’t available here. Turn the iPad sideways instead.'));
  else toast('Full screen isn’t available here. Turn the iPad sideways instead.');
};

/* gestures on the player: tap = controls, double-tap sides = ±10s, drag down = minimise, mini: tap = restore, swipe sideways = close */
const watch = $('#watch'), overlay = $('#overlay');
let g = null, lastTap = 0;
overlay.addEventListener('pointerdown', e => {
  if(e.target.closest('button, input, a')) return;
  g = {x:e.clientX, y:e.clientY, dx:0, dy:0, drag:false};
  overlay.setPointerCapture(e.pointerId);
});
overlay.addEventListener('pointermove', e => {
  if(!g) return;
  g.dx = e.clientX-g.x; g.dy = e.clientY-g.y;
  const mini = watch.classList.contains('mini');
  if(!g.drag && (Math.abs(g.dx)>10 || Math.abs(g.dy)>10)) g.drag = true;
  if(!g.drag) return;
  watch.style.transition = 'none';
  if(mini) watch.style.transform = `translateX(${g.dx}px)`, watch.style.opacity = String(Math.max(.3, 1-Math.abs(g.dx)/300));
  else if(g.dy>0 && Math.abs(g.dy)>Math.abs(g.dx)) watch.style.transform = `translateY(${g.dy}px)`;
});
overlay.addEventListener('pointerup', e => {
  if(!g) return; const mini = watch.classList.contains('mini');
  watch.style.transition = ''; watch.style.transform = ''; watch.style.opacity = '';
  if(g.drag){
    if(mini && Math.abs(g.dx)>90) closeWatch();
    else if(!mini && g.dy>110) minimise();
  } else if(mini){ restore() }
  else {
    const now = Date.now(), w = overlay.clientWidth, x = e.clientX - overlay.getBoundingClientRect().left;
    if(now-lastTap < 320 && playerReady && (x < w/3 || x > w*2/3)){
      const fwd = x > w*2/3; player.seekTo(Math.max(0, player.getCurrentTime() + (fwd?10:-10)), true);
      const f = $(fwd?'#flashR':'#flashL'); f.classList.add('show'); setTimeout(()=>f.classList.remove('show'), 600);
      lastTap = 0;
    } else if(!moreMenu.hidden){ closeMenu() }
    else { lastTap = now; toggleCtrls() }
  }
  g = null;
});
overlay.addEventListener('pointercancel', () => { g=null; watch.style.transform=''; watch.style.opacity=''; watch.style.transition='' });

function minimise(){ watch.classList.add('mini'); ctrls.classList.remove('show'); document.body.style.overflow='' }
function restore(){ watch.classList.remove('mini'); document.body.style.overflow='hidden'; showCtrls() }
function closeWatch(){ player?.stopVideo?.(); watch.hidden = true; watch.classList.remove('mini'); document.body.style.overflow=''; S.current=null }

/* ---------------- watch page ---------------- */
const scrollEl = $('#watchScroll');
async function openVideo(id, opts={}){
  if(S.current && S.current.id!==id && !opts.noPush) S.back.push(S.current.id);
  let v = cache.get(id) || {id, title:'', channelTitle:''};
  S.current = v; S.upnext = [];
  watch.hidden = false; watch.classList.remove('mini'); document.body.style.overflow='hidden';
  loadPlayer(id);
  renderWatch();
  scrollEl.scrollTop = 0;

  if(S.key && (v.views==null || !v.channelId)){
    try{ const [full] = await videosById([id]); if(full && S.current?.id===id){ cache.set(id, full); S.current = v = full; renderWatch() } }catch(e){}
  } else if(!S.key && !v.title){
    try{ const r = await fetch('https://noembed.com/embed?url='+encodeURIComponent('https://www.youtube.com/watch?v='+id)); const j = await r.json();
      if(j.title && S.current?.id===id){ v = {...v, title:j.title, channelTitle:j.author_name||''}; cache.set(id,v); S.current=v; renderWatch() } }catch(e){}
  }
  addHistory(v);
  loadChannel(v); loadUpNext(v); loadComments(v);
}
function addHistory(v){ S.history = [v, ...S.history.filter(h=>h.id!==v.id)].slice(0,100); LS.set('history', S.history) }
const inList = (arr,id) => arr.some(x=>x.id===id);

function renderWatch(){
  const v = S.current; if(!v) return;
  const subbed = v.channelId && inList(S.subs, v.channelId);
  const chan = S.chanInfo && S.chanInfo.id===v.channelId ? S.chanInfo : null;
  scrollEl.innerHTML = `
    <div class="block info">
      <button class="title-row" id="titleBtn" aria-expanded="false"><h1>${esc(v.title || 'Loading…')}</h1><svg><use href="#i-down"/></svg></button>
      <div class="views">${v.views!=null ? num(v.views)+' views' : '&nbsp;'}</div>
      <div class="desc" id="desc" hidden>${v.published?`<span class="pub">Published ${new Date(v.published).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}</span>`:''}${esc(v.description || 'No description.')}</div>
      <div class="actions">
        <button class="act" id="aLike" aria-label="Like" aria-pressed="${inList(S.liked,v.id)}"><svg><use href="#i-up"/></svg>${v.likes!=null?short(v.likes):''}</button>
        <button class="act" id="aDislike" aria-label="Dislike" aria-pressed="false"><svg><use href="#i-dn"/></svg></button>
        <button class="act" id="aShare" aria-label="Share"><svg><use href="#i-share"/></svg></button>
        <button class="act" id="aAdd" aria-label="Add to Watch later" aria-pressed="${inList(S.later,v.id)}"><svg><use href="#i-add"/></svg></button>
      </div>
    </div>
    <div class="block chan">
      ${avatarHTML(v.channelTitle, chan?.img)}
      <div class="grow"><div class="chan-name">${esc(v.channelTitle||'')}</div>${chan?.subs!=null?`<div class="chan-subs">${short(chan.subs)} subscribers</div>`:''}</div>
      ${v.channelId || !S.key ? `<button class="sub" id="subBtn" aria-pressed="${!!subbed}"><span class="s1"><svg><use href="${subbed?'#i-check':'#i-plus'}"/></svg>${subbed?'Subscribed':'Subscribe'}</span>${chan?.subs!=null?`<span class="s2">${short(chan.subs)}</span>`:''}</button>` : ''}
    </div>
    <div class="block">
      <div class="upnext-head"><h2>Up next</h2>
        <button class="switch" id="autoBtn" role="switch" aria-checked="${S.autoplay}">Autoplay<span class="track"></span></button></div>
      <div id="upnext">${upNextHTML()}</div>
    </div>
    <div class="block">
      <div class="comments-head"><h2>Comments${v.comments!=null?' · '+num(v.comments):''}</h2></div>
      <div id="comments">${S.commentsHTML && S.commentsFor===v.id ? S.commentsHTML : `<div class="muted">${S.key?'Loading comments…':'Comments load once you add a YouTube API key in the Account tab.'}</div>`}</div>
    </div>`;
  $('#titleBtn').onclick = e => { const b=e.currentTarget, open=b.getAttribute('aria-expanded')!=='true'; b.setAttribute('aria-expanded',open); $('#desc').hidden=!open };
  $('#aLike').onclick = () => toggleList('liked', 'Added to Liked videos', 'Removed from Liked videos');
  $('#aDislike').onclick = e => { const b=e.currentTarget; const on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',on); if(on && inList(S.liked,v.id)) toggleList('liked') };
  $('#aAdd').onclick = () => toggleList('later', 'Saved to Watch later', 'Removed from Watch later');
  $('#aShare').onclick = async () => {
    const url = 'https://youtu.be/'+v.id;
    try{ if(navigator.share){ await navigator.share({title:v.title, url}); return } }catch(e){ if(e.name==='AbortError') return }
    try{ await navigator.clipboard.writeText(url); toast('Link copied') }catch(e){ toast(url) }
  };
  $('#autoBtn').onclick = e => { S.autoplay=!S.autoplay; LS.set('autoplay',S.autoplay); e.currentTarget.setAttribute('aria-checked', S.autoplay) };
  $('#subBtn') && ($('#subBtn').onclick = () => {
    if(!v.channelId){ toast('Add an API key in Account to subscribe to channels'); return }
    if(inList(S.subs, v.channelId)){ S.subs = S.subs.filter(s=>s.id!==v.channelId); toast('Unsubscribed') }
    else { S.subs = [{id:v.channelId, title:v.channelTitle, img:chan?.img||''}, ...S.subs]; toast('Subscribed to '+v.channelTitle) }
    LS.set('subs', S.subs); renderWatch();
  });
}
function toggleList(name, onMsg, offMsg){
  const v = S.current, arr = S[name];
  if(inList(arr, v.id)){ S[name] = arr.filter(x=>x.id!==v.id); offMsg && toast(offMsg) }
  else { S[name] = [v, ...arr].slice(0,200); onMsg && toast(onMsg) }
  LS.set(name, S[name]); renderWatch();
}
function upNextHTML(){
  if(!S.upnext.length) return `<div class="muted">${S.key?'Loading…':''}</div>`;
  const [first, ...rest] = S.upnext;
  return `<div class="rows upnext-first">${vrow(first)}</div><div class="rows">${rest.map(vrow).join('')}</div>`;
}

async function loadChannel(v){
  if(!S.key || !v.channelId) return;
  try{
    const j = await yt('channels',{part:'snippet,statistics', id:v.channelId}); const c = j.items?.[0]; if(!c) return;
    S.chanInfo = {id:c.id, img:c.snippet?.thumbnails?.default?.url, subs:c.statistics?.hiddenSubscriberCount?null:c.statistics?.subscriberCount};
    const s = S.subs.find(x=>x.id===c.id); if(s && !s.img){ s.img = S.chanInfo.img; LS.set('subs',S.subs) }
    if(S.current?.id===v.id) renderWatch();
  }catch(e){}
}
async function loadUpNext(v){
  const id = v.id;
  if(!S.key){ S.upnext = DEMO.filter(d=>d.id!==id); $('#upnext') && ($('#upnext').innerHTML = upNextHTML()); return }
  try{
    const words = (v.title||'').replace(/[\(\[].*?[\)\]]/g,'').split(/\s+/).slice(0,5).join(' ');
    const [chanList, searchIds] = await Promise.all([
      v.channelId ? channelUploads(v.channelId, 10).catch(()=>[]) : [],
      words ? yt('search',{part:'id', type:'video', q:words, maxResults:15, relevanceLanguage:'en'}).then(j=>j.items.map(i=>i.id.videoId)).catch(()=>[]) : []
    ]);
    const searchList = await videosById(searchIds).catch(()=>[]);
    const seen = new Set([id]), out = [];
    const a = searchList, b = chanList;
    for(let i=0; i<Math.max(a.length,b.length); i++) for(const x of [a[i], b[i]]) if(x && !seen.has(x.id)){ seen.add(x.id); out.push(x) }
    if(S.current?.id!==id) return;
    S.upnext = remember(out.slice(0,20));
    $('#upnext') && ($('#upnext').innerHTML = upNextHTML() || '<div class="muted">Nothing to suggest.</div>');
  }catch(e){ $('#upnext') && ($('#upnext').innerHTML = `<div class="muted">Couldn't load Up next: ${esc(e.message)}</div>`) }
}
async function loadComments(v){
  if(!S.key) return;
  const id = v.id; S.commentsFor = null;
  let html;
  try{
    const j = await yt('commentThreads',{part:'snippet', videoId:id, maxResults:25, order:'relevance', textFormat:'plainText'});
    html = j.items.length ? j.items.map(t=>{ const c=t.snippet.topLevelComment.snippet;
      return `<div class="comment">${avatarHTML(c.authorDisplayName, c.authorProfileImageUrl)}<div class="vtext">
        <div class="who"><b>${esc(c.authorDisplayName.replace(/^@/,''))}</b> · ${ago(c.publishedAt)}</div>
        <p>${esc(c.textDisplay)}</p>${c.likeCount?`<div class="likes"><svg><use href="#i-up"/></svg>${short(c.likeCount)}</div>`:''}</div></div>` }).join('')
      : '<div class="muted">No comments yet.</div>';
  }catch(e){ html = /disabled/i.test(e.message) ? '<div class="muted">Comments are turned off for this video.</div>' : `<div class="muted">Couldn't load comments: ${esc(e.message)}</div>` }
  if(S.current?.id!==id) return;
  S.commentsHTML = html; S.commentsFor = id;
  $('#comments') && ($('#comments').innerHTML = html);
}

/* ---------------- wiring ---------------- */
document.addEventListener('click', e => { const b = e.target.closest('[data-play]'); if(b){ e.preventDefault(); openVideo(b.dataset.play) } });
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { closeSearch(); if(!watch.hidden && !watch.classList.contains('mini')) minimise(); showTab(t.dataset.tab) });
function closeSearch(){ $('#barSearch').hidden = true; $('#barMain').hidden = false }
$('#openSearch').onclick = () => { $('#barMain').hidden = true; $('#barSearch').hidden = false; $('#q').focus() };
$('#closeSearch').onclick = () => { closeSearch(); showTab(S.tab) };
function goSearch(){ const q = $('#q').value.trim(); if(!q) return; $('#q').blur(); if(!watch.hidden && !watch.classList.contains('mini') && !parseId(q)) minimise(); runSearch(q) }
$('#barSearch').onsubmit = e => { e.preventDefault(); goSearch() };
/* Pasting a YouTube link plays it straight away, no need to press Enter. */
$('#q').addEventListener('paste', () => setTimeout(() => { if(parseId($('#q').value)) goSearch() }, 0));

showTab('home');

/* Status-bar tint: black while watching (like the 2015 app), red while browsing. */
function tint(){ const w=document.getElementById('watch'); const black = !w.hidden && !w.classList.contains('mini');
  const m=document.getElementById('themeColor'); if(m) m.setAttribute('content', black ? '#000000' : getComputedStyle(document.documentElement).getPropertyValue('--bar').trim() || '#E52D27') }
new MutationObserver(tint).observe(document.getElementById('watch'), {attributes:true, attributeFilter:['hidden','class']});
tint();
/* Open a video straight from the address: ?v=VIDEO_ID or ?v=<full YouTube link> */
(() => { try{ const p = new URLSearchParams(location.search).get('v'); const id = p && parseId(p); if(id) openVideo(id) }catch(e){} })();
</script>
<script src="https://www.youtube.com/iframe_api"></script>
